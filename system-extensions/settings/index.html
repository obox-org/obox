<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>设置</h1>
    </header>

    <section class="section">
      <h2>外观</h2>
      <label class="row">
        <span>主题</span>
        <select id="theme"></select>
      </label>
    </section>

    <section class="section">
      <h2>快捷键</h2>
      <p class="hint">点击「重置」恢复默认；修改请在命令面板中执行对应命令。</p>
      <ul id="keys" class="keys"></ul>
    </section>

    <section class="section">
      <h2>宿主设置</h2>
      <p class="hint">
        直接编辑某项的 JSON 值（例如 <code>network.proxy</code>）；保存后立即生效。
      </p>
      <div class="row">
        <input id="setting-key" class="text" placeholder="设置键（如 network.proxy）" />
        <button id="setting-load" class="btn" type="button">读取</button>
      </div>
      <textarea id="setting-value" class="json" spellcheck="false" placeholder="JSON 值"></textarea>
      <div class="row">
        <button id="setting-save" class="btn" type="button">保存</button>
        <span id="setting-status" class="status"></span>
      </div>
    </section>

    <script type="module" src="./page.js"></script>
  </body>
</html>
