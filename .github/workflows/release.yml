# Obox Release 工作流
# 本地打 tag（v<version>，如 v1.0.0）并 push 后自动触发：
#   git tag v1.0.0 && git push origin v1.0.0
# 流程：checkout tag → 装依赖 → 校验版本 → typecheck + lint + 单元测试 → electron-vite 构建 → electron-builder 编译 x64/arm64 安装包 → 创建/更新 GitHub Release。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 release 与上传产物需要

# 同一 tag 的连续构建取消旧的（改 CI 后重推 tag 的常见场景），避免并发发布互相覆盖资产
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 版本单一来源：本地与 CI 都读 .nvmrc，避免两处硬编码漂移
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 校验 tag 版本与 package.json version 一致（v1.0.0 ↔ 1.0.0）
      - name: Verify tag version matches package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkgVersion) {
            Write-Error "Tag version ($tag) does not match package.json version ($pkgVersion)"
            exit 1
          }
          Write-Output "Tag version OK: $tag"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tag 直推会绕过 PR 检查，因此发版前同样跑单测（与 pr-check.yml 保持一致）
      - name: Test
        run: npm test

      # 构建主进程/preload/renderer 到 out/（electron-builder 打包 app.asar 的入口依赖 out/main/index.js）
      - name: Build
        run: npm run build

      # 编译 Windows 安装包并发布（同一步骤内构建+发布，避免跨步骤产物不可见）
      # - 一次构建 x64 + arm64 两个安装包（--x64 --arm64；electron-builder 下载对应架构 Electron）
      # - electron-builder 只编译（--publish never，发布由 gh release 负责）
      # - 输出到 runner 临时目录（绝对路径，避免工作区相对路径/gitignore 干扰）
      # - 上传 obox-<version>-<arch>-setup.exe（x64/arm64）+ latest.yml + *.blockmap
      # - **更新元数据只有单一 latest.yml**（Windows 下 electron-builder 不生成架构后缀文件，
      #   其 files 数组含全部架构安装包，electron-updater 按机器架构自动选）→ 不存在 latest-arm64.yml
      # - blockmap 用于差分更新；缺了会让 electron-updater 每次都回退全量下载
      - name: Build and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $outDir = Join-Path $env:RUNNER_TEMP "obox-release"
          Write-Output "output dir: $outDir"
          # 1) 编译 x64 + arm64 安装包到 runner 临时目录（绝对路径）
          npx electron-builder --win nsis --x64 --arm64 --publish never --config.directories.output="$outDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "after build, output dir contents:"
          Get-ChildItem $outDir -ErrorAction SilentlyContinue | Select-Object Name, Length
          # 2) 定位两个架构的安装包（obox-<version>-x64-setup.exe / -arm64-setup.exe）
          $exes = @(Get-ChildItem -Path $outDir -Filter "obox-*-setup.exe" -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            Get-ChildItem $outDir -ErrorAction SilentlyContinue | Select-Object Name, Length
            Write-Error "setup.exe not found in $outDir"; exit 1
          }
          $assets = @()
          foreach ($exe in $exes) { $assets += $exe.FullName }
          # 3) 更新元数据（单一 latest.yml）+ 差分更新所需的 blockmap
          $meta = Join-Path $outDir "latest.yml"
          if (-not (Test-Path $meta)) { Write-Error "latest.yml 未生成（$outDir）"; exit 1 }
          $assets += $meta
          foreach ($bm in @(Get-ChildItem -Path $outDir -Filter "*.blockmap" -ErrorAction SilentlyContinue)) {
            $assets += $bm.FullName
          }
          Write-Output "uploading: $($assets -join ', ')"
          # 4) 发布：不存在则创建，已存在则覆盖上传（幂等，且**不删除 git tag**——
          #    旧实现 gh release delete --cleanup-tag 会连 tag 一起删，失败后 tag 丢失、窗口期更新检查 404）
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "release $tag 已存在：覆盖上传资产"
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets `
              --title "obox $tag" `
              --notes "obox $tag Windows 安装包（x64 / arm64，向导式安装：可选目录与安装用户）"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 上传构建日志（可选，便于排查）
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/**/*.log
            dist/**/*.yml
          if-no-files-found: ignore
