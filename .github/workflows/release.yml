# Obox Release 工作流
# 本地打 tag（v<version>，如 v1.0.0）并 push 后自动触发：
#   git tag v1.0.0 && git push origin v1.0.0
# 流程：checkout tag → 装依赖 → typecheck → electron-builder 编译 Windows 安装包 → 发布到 GitHub Releases。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 release 与上传产物需要

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 校验 tag 版本与 package.json version 一致（v1.0.0 ↔ 1.0.0）
      - name: Verify tag version matches package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkgVersion) {
            Write-Error "Tag version ($tag) does not match package.json version ($pkgVersion)"
            exit 1
          }
          Write-Output "Tag version OK: $tag"

      - name: Typecheck
        run: npm run typecheck

      # 构建主进程/preload/renderer 到 out/（electron-builder 打包 app.asar 的入口依赖 out/main/index.js）
      - name: Build
        run: npm run build

      # 编译 Windows 安装包并发布（同一步骤内构建+发布，避免跨步骤产物不可见）
      # - electron-builder 只编译（--publish never，发布由 gh release 负责）
      # - 只上传 obox-<version>-setup.exe；源码归档由 GitHub 自动生成；其他产物不发布
      - name: Build and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # 1) 编译安装包（产物在 release/obox-<version>-setup.exe）
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 2) 定位安装包
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          Write-Output "release dir contents:"
          Get-ChildItem $releaseDir -ErrorAction SilentlyContinue | Select-Object Name, Length
          $exe = Get-ChildItem -Path $releaseDir -Filter "obox-*.setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "obox-*.setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { Write-Error "setup.exe not found"; exit 1 }
          Write-Output "uploading: $($exe.FullName)"
          # 3) 发布（release 已存在则删除重建，幂等）
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag $exe.FullName `
            --title "Obox $tag" `
            --notes "Obox $tag Windows 安装包"

      # 上传构建日志（可选，便于排查）
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/**/*.log
            dist/**/*.yml
          if-no-files-found: ignore
