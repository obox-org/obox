# Obox Release 工作流
# 本地打 tag（v<version>，如 v1.0.0）并 push 后自动触发：
#   git tag v1.0.0 && git push origin v1.0.0
# 流程：checkout tag → 装依赖 → typecheck → electron-builder 编译 Windows 安装包 → 发布到 GitHub Releases。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 release 与上传产物需要

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 校验 tag 版本与 package.json version 一致（v1.0.0 ↔ 1.0.0）
      - name: Verify tag version matches package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkgVersion) {
            Write-Error "Tag version ($tag) does not match package.json version ($pkgVersion)"
            exit 1
          }
          Write-Output "Tag version OK: $tag"

      - name: Typecheck
        run: npm run typecheck

      # 构建主进程/preload/renderer 到 out/（electron-builder 打包 app.asar 的入口依赖 out/main/index.js）
      - name: Build
        run: npm run build

      # 仅编译 Windows 安装包（不 publish，产物 release/obox-<version>-setup.exe）
      - name: Build installer
        run: npx electron-builder --win nsis

      # 创建 GitHub Release 并只上传安装包：
      # - 源码归档（zip/tar.gz）由 GitHub 自动生成，无需手动上传
      # - 只上传 obox-<version>-setup.exe，其他产物（win-unpacked/latest.yml/blockmap）不发布
      - name: Create GitHub Release and upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem release/obox-*.setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "setup.exe not found"; exit 1 }
          # release 已存在则删除重建（幂等，处理 CI 重跑/失败残留）
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag $exe.FullName `
            --title "Obox $tag" `
            --notes "Obox $tag Windows 安装包"

      # 上传构建日志（可选，便于排查）
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/**/*.log
            dist/**/*.yml
          if-no-files-found: ignore
