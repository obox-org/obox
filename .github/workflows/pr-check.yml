# PR 检查工作流：每个 PR（目标 master）必须通过 typecheck + lint 才能合并。
# 配合 master 分支保护规则（Require status checks）作为合并门槛。
name: PR Check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

# 同一 PR 连续推送时取消旧运行：避免排队占用 runner，也让状态检查只反映最新提交
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 版本单一来源：本地与 CI 都读 .nvmrc，避免两处硬编码漂移
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
