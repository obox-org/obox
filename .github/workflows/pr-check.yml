# PR 检查工作流：每个 PR（目标 master）必须通过 typecheck + lint 才能合并。
# 配合 master 分支保护规则（Require status checks）作为合并门槛。
name: PR Check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
